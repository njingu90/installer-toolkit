name: Lint & Test

on:
  push:
    paths:
      - 'main.sh'
      - 'install.sh'
      - 'lib/**/*.sh'
      - 'scripts/**/*.sh'
      - 'test/**/*.bats'
      - '.github/workflows/lint-and-test.yml'
  pull_request:
    paths:
      - 'main.sh'
      - 'install.sh'
      - 'lib/**/*.sh'
      - 'scripts/**/*.sh'
      - 'test/**/*.bats'
      - '.github/workflows/lint-and-test.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Shell Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: bash -n main.sh install.sh lib/*.sh scripts/*.sh

      - name: Shellcheck
        run: shellcheck main.sh install.sh lib/*.sh scripts/*.sh

  bats:
    name: BATS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: bats --print-output-on-failure test
